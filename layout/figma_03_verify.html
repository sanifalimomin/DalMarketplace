<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>DalMarketplace — Verify (Figma)</title></head>
<!-- Fully inline styles; no <style>, no variables, no classes, no pseudo-elements. -->
<body style="margin:0;font-family:Inter, Arial, sans-serif;">
  <div style="width:1280px;height:800px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;">
    <div style="width:420px;background:#ffffff;border:1px solid #e2e2e2;border-radius:14px;padding:34px 32px;box-shadow:0 4px 16px rgba(0,0,0,0.06);text-align:center;box-sizing:border-box;">

      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;">
        <div style="width:30px;height:30px;border-radius:8px;background:#1a1a1a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;">DM</div>
        <div style="font-size:18px;font-weight:700;color:#1a1a1a;">DalMarketplace</div>
      </div>

      <!-- Mail icon -->
      <div style="width:64px;height:64px;border-radius:50%;background:#f2f2f2;border:1px solid #cfcfcf;display:flex;align-items:center;justify-content:center;margin:22px auto 18px;color:#808080;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </div>

      <div style="font-size:19px;font-weight:600;color:#1a1a1a;margin-bottom:8px;">Check your Dalhousie inbox</div>
      <div style="font-size:14px;color:#808080;line-height:1.6;">We sent a verification link to<br><span style="color:#1a1a1a;font-weight:600;">sa987654@dal.ca</span>.<br>Click the link to confirm you are a current or former Dalhousie student.</div>

      <!-- Checklist -->
      <div style="margin:22px 0;text-align:left;background:#fafafa;border:1px solid #e2e2e2;border-radius:10px;padding:18px;box-sizing:border-box;">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;color:#1a1a1a;font-weight:600;font-size:13px;">
          <div style="width:16px;height:16px;border-radius:4px;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;">&#10003;</div> Account created
        </div>
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;color:#1a1a1a;font-weight:600;font-size:13px;">
          <div style="width:16px;height:16px;border-radius:4px;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;">&#10003;</div> Verification email sent
        </div>
        <div style="display:flex;align-items:center;gap:9px;color:#808080;font-size:13px;">
          <div style="width:16px;height:16px;border-radius:4px;border:1px solid #cfcfcf;background:#fff;box-sizing:border-box;"></div> Email confirmed
        </div>
      </div>

      <div style="width:100%;height:44px;background:#1a1a1a;color:#ffffff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;">I've verified &mdash; continue</div>
      <div style="font-size:13px;color:#808080;margin-top:20px;">Didn't get it? <span style="color:#1a1a1a;font-weight:600;">Resend link</span> &middot; check spam</div>
    </div>
  </div>
</body>
</html>
