<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DalMarketplace — Sign in (Figma import test)</title>
</head>
<!-- Fully inline styles, no <style> block, no CSS variables, no classes,
     no ::before/::after pseudo-elements. Built for html.to.design import. -->
<body style="margin:0;font-family:Inter, Arial, sans-serif;">

  <!-- FRAME -->
  <div style="width:1280px;height:780px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;">

    <!-- CARD -->
    <div style="width:420px;background:#ffffff;border:1px solid #e2e2e2;border-radius:14px;padding:34px 32px;box-shadow:0 4px 16px rgba(0,0,0,0.06);">

      <!-- Brand -->
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;">
        <div style="width:30px;height:30px;border-radius:8px;background:#1a1a1a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;">DM</div>
        <div style="font-size:18px;font-weight:700;color:#1a1a1a;">DalMarketplace</div>
      </div>

      <!-- Subtitle -->
      <div style="text-align:center;color:#808080;font-size:14px;margin-bottom:26px;">Sign in with your Dalhousie account</div>

      <!-- Email field -->
      <div style="margin-bottom:18px;">
        <div style="font-size:13px;font-weight:600;color:#4d4d4d;margin-bottom:7px;">Dalhousie email</div>
        <div style="width:100%;height:44px;border:1px solid #3f3f3f;border-radius:6px;padding:0 13px;background:#ffffff;color:#1a1a1a;font-size:14px;display:flex;align-items:center;">sa987654@dal.ca</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#2f6b35;margin-top:7px;">
          <span style="font-weight:700;">&#10003;</span> Recognized Dalhousie address
        </div>
      </div>

      <!-- Password field -->
      <div style="margin-bottom:8px;">
        <div style="font-size:13px;font-weight:600;color:#4d4d4d;margin-bottom:7px;">Password</div>
        <div style="width:100%;height:44px;border:1px solid #cfcfcf;border-radius:6px;padding:0 13px;background:#ffffff;color:#1a1a1a;font-size:16px;letter-spacing:2px;display:flex;align-items:center;">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div>
      </div>

      <!-- Forgot password -->
      <div style="text-align:right;margin-bottom:20px;">
        <span style="font-size:12px;color:#4d4d4d;font-weight:600;">Forgot password?</span>
      </div>

      <!-- Sign in button -->
      <div style="width:100%;height:44px;background:#1a1a1a;color:#ffffff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;">Sign in</div>

      <!-- Divider -->
      <div style="display:flex;align-items:center;gap:12px;margin:20px 0;">
        <div style="flex:1;height:1px;background:#e2e2e2;"></div>
        <div style="font-size:12px;color:#a6a6a6;">only @dal.ca and verified alumni</div>
        <div style="flex:1;height:1px;background:#e2e2e2;"></div>
      </div>

      <!-- Alt action -->
      <div style="text-align:center;font-size:13px;color:#808080;">
        New to DalMarketplace? <span style="color:#1a1a1a;font-weight:600;">Create an account</span>
      </div>

    </div>
  </div>

</body>
</html>
